---
# Installs a single-node Kubernetes cluster (k3s) on the application VM.
- name: Configure Kubernetes node (k3s)
  hosts: k8s
  become: true
  tasks:
    - name: Install packages
      ansible.builtin.apt:
        name: [curl]
        update_cache: true
        state: present

    - name: Download k3s installer
      ansible.builtin.get_url:
        url: https://get.k3s.io
        dest: /tmp/k3s-install.sh
        mode: "0755"

    - name: Install k3s (kubeconfig readable by all local users)
      ansible.builtin.command: /tmp/k3s-install.sh
      args:
        creates: /usr/local/bin/k3s
      environment:
        INSTALL_K3S_EXEC: "server --write-kubeconfig-mode 644"

    - name: Wait until the node is Ready
      ansible.builtin.command: k3s kubectl wait --for=condition=Ready node --all --timeout=180s
      changed_when: false

    - name: Create namespace
      ansible.builtin.command: k3s kubectl create namespace cia2-demo
      register: ns
      failed_when: ns.rc != 0 and 'AlreadyExists' not in ns.stderr
      changed_when: ns.rc == 0
